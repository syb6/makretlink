    <path d="M0 -66 L -6 -96 L 6 -96 Z" fill="#5F7A2B"/>
  </g>

  <!-- lettuce -->
  <g transform="translate(300 300)">
    <ellipse cx="0" cy="0" rx="46" ry="26" fill="#9DBF4B"/>
    <path d="M-40 -4 C -20 -22, 20 -22, 40 -4 C 22 6, -22 6, -40 -4 Z" fill="#B7D060"/>
    <path d="M-30 6 C -12 -6, 12 -6, 30 6" stroke="#7FA035" stroke-width="4" fill="none" stroke-linecap="round"/>
