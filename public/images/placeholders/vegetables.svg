      <stop offset="0" stop-color="#F7F7F3"/><stop offset="1" stop-color="#EBF0C8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="185" r="125" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="300" cy="322" rx="150" ry="18" fill="#5F6B14" opacity="0.10"/>

