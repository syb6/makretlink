    <path d="M0 -70 C -6 -84, -2 -92, 2 -98" stroke="#5F7A2B" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M0 -66 L -34 -74 C -26 -58, -12 -54, 0 -66 Z" fill="#5F7A2B"/>
