    <path d="M-6 95 C -2 97, 2 97, 6 95" stroke="#C96A24" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-4 128 C -1 130, 1 130, 4 128" stroke="#C96A24" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M0 30 C -18 6, -34 0, -44 -14 C -22 -16, -8 -6, 0 30 Z" fill="#6F9B3F"/>
    <path d="M0 30 C 0 -2, -2 -18, 4 -32 C 16 -14, 12 8, 0 30 Z" fill="#88A93C"/>
    <path d="M0 30 C 18 8, 32 0, 44 -12 C 24 -18, 8 -8, 0 30 Z" fill="#6F9B3F"/>
  </g>

  <!-- tomato -->
  <g transform="translate(385 205)">
