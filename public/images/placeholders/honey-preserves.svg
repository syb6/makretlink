    <path d="M-26 -32 L 26 -32 C 30 -20, 32 -10, 32 0 L 32 44 C 32 52, 27 58, 19 58 L -19 58 C -27 58, -32 52, -32 44 L -32 0 C -32 -10, -30 -20, -26 -32 Z" fill="#C9554F"/>
