    <path d="M-38 -68 L 38 -68 C 44 -52, 46 -36, 46 -18 L 46 66 C 46 76, 40 82, 30 82 L -30 82 C -40 82, -46 76, -46 66 L -46 -18 C -46 -36, -44 -52, -38 -68 Z" fill="#E9A83C"/>
