<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Honey and preserves">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F7F3"/><stop offset="1" stop-color="#FBF0D3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="185" r="125" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="300" cy="322" rx="150" ry="18" fill="#5F6B14" opacity="0.10"/>

  <!-- honey jar -->
  <g transform="translate(258 210)">
